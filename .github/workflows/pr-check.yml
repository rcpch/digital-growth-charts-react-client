# Runs the PR check script

name: Run PR checks

permissions:
  id-token: write
  contents: read

on:
  pull_request:
    branches:
      - "*"

jobs:
  build-and-run-pytest-suite-in-docker-compose:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full code repo
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0 # to allow git_context_processor.py to still work

      - name: Install NPM packages
        run: npm ci

      - name: Build project
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_APP_GROWTH_API_BASEURL: ${{ secrets.VITE_APP_GROWTH_API_BASEURL }}
          VITE_APP_API_KEY: ${{secrets.VITE_APP_API_KEY }}
        run: npm run build